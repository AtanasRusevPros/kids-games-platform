name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-games-platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: kids-games-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint shell scripts
        run: shellcheck infra/podman/scripts/backup.sh infra/podman/scripts/restore.sh scripts/dev-db.sh infra/podman/smoke-test.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-games-platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: kids-games-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

  web-tests:
    name: Web Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-games-platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: kids-games-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web tests
        run: pnpm test:web

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-games-platform
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kids_games_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: kids-games-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: kids-games-platform/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kids_games_test
        run: node --env-file=/dev/null -r tsx/esm src/db/migrate.ts
        # DATABASE_URL is set inline above; --env-file=/dev/null prevents loading .env

      - name: Run seed
        working-directory: kids-games-platform/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kids_games_test
        run: node --env-file=/dev/null -r tsx/esm src/db/seed.ts

      - name: Integration tests
        working-directory: kids-games-platform/apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kids_games_dev
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kids_games_test
          JWT_SECRET: ci-jwt-secret-min-32-chars-here-ok
          REFRESH_SECRET: ci-refresh-secret-min-32-chars-ok
        run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kids-games-platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: kids-games-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
